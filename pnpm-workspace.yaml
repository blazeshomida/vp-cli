packages:
  - .

allowBuilds:
  esbuild: true

catalog:
  "@types/node": ^25.9.3
  tsx: ^4.22.4
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
  vitest: 5.0.4

catalogMode: prefer

peerDependencyRules:
  allowedVersions:
    vite: "*"
    vitest: "*"
  allowAny:
    - vite
    - vitest
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
